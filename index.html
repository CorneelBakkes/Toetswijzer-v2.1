.read-item>summary:before {content:'▸';display:inline-block;margin-right:9px;color:var(--purple);}
.read-item[open]>summary:before {content:'▾';}
.read-item .read-date {font-weight:600;}
.read-body {padding:0 15px 14px;}
.read-body dl {display:grid;grid-template-columns:180px 1fr;gap:6px 16px;margin:10px 0;font-size:12px;}
.read-body dt {font-weight:600;}
.read-body dd {margin:0;}
.read-body p {font-size:12px;margin:8px 0;}
.read-body .read-evl {color:var(--muted);}
.dialog-fallback {position:fixed;inset:5vh auto auto 50%;transform:translateX(-50%);z-index:1001;display:block;background:white;overflow:auto;}
.modal-open:before {content:'';position:fixed;inset:0;background:#23142d88;z-index:1000;}
@media(max-width:540px){#read-only{padding:20px 16px}.read-body dl{grid-template-columns:1fr;gap:2px}.read-body dd{margin-bottom:7px}.read-route>summary{font-size:17px}.read-routes a{font-size:12px}.header-inner{gap:12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
/* Heldere roosterkoppen, afgestemd op de kolommen van iedere kaart. */
.legend{margin-top:18px;padding:11px 18px;background:#f1edf4;border-radius:7px;font-size:12px;letter-spacing:0;text-transform:none;font-weight:700;color:#4b3b55}.group-sem{margin:24px 0 8px;font-size:16px;font-weight:750;color:#31243b}.group-period{margin:7px 0 10px;padding-left:25px;font-size:13px;font-weight:650;color:#5e4b69}.group-period:before{width:16px;background:#9f8aac}

/* Compactere EvL-weergave en een rustiger beheerformulier. */

ijke jaarplanner</h2><p>Kies <strong>Mijn jaarplanner maken</strong> om rondes aan te vinken. Je kunt selecties uit verschillende roosters combineren. Je selectie blijft tijdens deze browsersessie beschikbaar, ook als je van rooster wisselt. Sluiten of vernieuwen kan de selectie wissen.</p>${viewerNote()}<p>Je kunt je selectie bewaren, een afdruk maken of een .ics-bestand voor je agenda downloaden. Een .ics-export is een momentopname, geen automatische synchronisatie. Opnieuw importeren kan dubbele afspraken opleveren.</p><p>Bij meerdere afnametijden kies je zelf de passende tijdregel, of alleen de datum. Een breed afnamevenster of een afnameweek wordt niet vertaald naar een persoonlijke starttijd.</p><h2>Ontbrekende gegevens</h2><p>Neem bij ontbrekende of tegenstrijdige informatie contact op met het bedrijfsbureau. De Toetswijzer toont de gegevens die in de actuele toetsplanning zijn vastgelegd.</p></section></div><section class="panel"><h2>Bronnen</h2><p>De planning en toetslinks worden rechtstreeks uit <strong>Toetswijzer-invulbladen.xlsx</strong> ingelezen.</p><p>Raadpleeg bij twijfel het offici&euml;le jaartoetsrooster via de <a href="https://stichtingfontys.sharepoint.com/sites/016_00" target="_blank" rel="noopener noreferrer">SharePoint-site van de opleiding</a>.</p></section>${footer()}`; }
